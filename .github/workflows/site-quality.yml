# בדיקת איכות לאתר על כל שינוי, עם שני כלים מובילים מגיטהאב:
#  - lychee (lycheeverse/lychee): כל קישור פנימי בכל דף מוביל לקובץ שקיים.
#  - Lighthouse CI (GoogleChrome/lighthouse-ci דרך treosh/lighthouse-ci-action):
#    נגישות (ת"י 5568 / WCAG), SEO, ביצועים ו-best practices לכל דף.
#    נגישות ו-SEO חוסמים; ביצועים ו-best practices רק מזהירים (משתנים בין הרצות).
# הספים ב-.lighthouserc.json. הדוח המלא נשמר כ-artifact של ההרצה.
name: Site quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Internal links (lychee, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --fallback-extensions html --index-files index.html
            --root-dir ${{ github.workspace }}
            '*.html'
          fail: true

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
